name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'contracts/deployments/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      chain_id:
        description: 'Chain to build for (97 = BSC testnet, 56 = BSC mainnet)'
        required: true
        default: '97'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restrict manual deployment to current main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: npm ci
        working-directory: web
      - name: Test affected behavior
        if: github.event_name == 'push'
        working-directory: web
        env:
          DIFF_BASE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${DIFF_BASE}^{commit}" 2>/dev/null; then
            DIFF_BASE=$(git hash-object -t tree /dev/null)
          fi
          npx vitest run --changed="$DIFF_BASE" --passWithNoTests
      - run: npm run build
        working-directory: web
        env:
          STRICT_DEPLOYMENT: '1'
          VITE_CHAIN_ID: ${{ github.event.inputs.chain_id || '97' }}
          VITE_BASE_PATH: /
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
