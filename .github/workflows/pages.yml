name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'contracts/deployments/**', 'packages/abi/**', 'scripts/release-changelog-guard.mjs', 'scripts/lib/release-changelog.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      chain_id:
        description: 'Chain to build for (97 = BSC testnet, 56 = BSC mainnet)'
        required: true
        default: '97'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require one changelog entry for this release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual recovery may only redeploy the exact current main tip. Selecting another ref
            # in the Actions UI must not turn validate-only into a changelog bypass.
            git fetch --no-tags origin main
            if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Manual Pages deployment is restricted to the exact current main SHA."
              exit 1
            fi
            node scripts/release-changelog-guard.mjs --validate-only
          else
            BASE="$EVENT_BEFORE"
            if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)"; fi
            node scripts/release-changelog-guard.mjs --require-release-entry --base "$BASE" --head "${{ github.sha }}"
          fi
      - run: npm ci
        working-directory: web
      # The deploy path is independent of the CI workflow, so without this the site could ship
      # from a commit whose UI tests are red — including the off-chain price-proof logic that
      # decides which price a trader is shown.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # STRICT_DEPLOYMENT makes a missing contracts/deployments/<chainId>.json a hard failure,
          # so the site can never ship pointing at placeholder addresses.
          STRICT_DEPLOYMENT: '1'
          VITE_CHAIN_ID: ${{ github.event.inputs.chain_id || '97' }}
          # Served at the root of updown.bluffking.ai, not from a repository subpath. The custom
          # domain is what makes the host swappable later: moving off GitHub Pages becomes a DNS
          # change rather than a new URL for everyone who has bookmarked the old one.
          # The repository's Settings > Pages > Custom domain is the authoritative hostname
          # binding for an Actions deployment. web/public/CNAME remains in the artifact as portable
          # host metadata, but it does not replace that repository setting.
          VITE_BASE_PATH: /
          # WalletConnect is what gives phone browsers a path beyond the MetaMask deep link
          # (Trust / OKX / Binance wallets). It turns on the moment the repository variable
          # WALLETCONNECT_PROJECT_ID is set (Settings → Secrets and variables → Actions →
          # Variables) — the project id is created at https://cloud.reown.com and is a public
          # client-side identifier, not a secret. Unset, this resolves to empty and the app
          # ships injected-only, exactly as before. See RUNBOOK §1.10.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
