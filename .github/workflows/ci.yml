name: CI

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff.outputs.base }}
      contracts: ${{ steps.diff.outputs.contracts }}
      keeper: ${{ steps.diff.outputs.keeper }}
      web: ${{ steps.diff.outputs.web }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: diff
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${PR_BASE:-$PUSH_BASE}"
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE" HEAD > /tmp/changed-paths
          for MODULE in contracts keeper web scripts; do
            PATTERN="^${MODULE}/|^\.github/workflows/ci\.yml$"
            if [ "$MODULE" = keeper ] || [ "$MODULE" = web ]; then
              PATTERN="$PATTERN|^contracts/deployments/"
            fi
            if grep -Eq "$PATTERN" /tmp/changed-paths; then
              echo "$MODULE=true" >> "$GITHUB_OUTPUT"
            fi
          done

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/tests/bet-window.test.mjs scripts/tests/gas-refill.test.mjs

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: v1.7.1}
      - name: Build and check the market surface
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge fmt --check
          forge build --deny warnings
          forge test --match-contract '^(UpDownSurfaceTest|RelayAggregatorTest|RelayAggregatorMarketTest|TestUSDTTest)$'

  keeper:
    needs: changes
    if: needs.changes.outputs.keeper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: keeper/package-lock.json}
      - run: npm ci
        working-directory: keeper
      - run: npm run build
        working-directory: keeper
      - name: Test affected behavior
        working-directory: keeper
        env:
          DIFF_BASE: ${{ needs.changes.outputs.base }}
        run: npx vitest run --changed="$DIFF_BASE" --passWithNoTests

  web:
    needs: changes
    # Main pushes are built and tested once, by Pages.
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env: {VITE_CHAIN_ID: '97', STRICT_DEPLOYMENT: '1'}
      - name: Test affected behavior
        working-directory: web
        env:
          DIFF_BASE: ${{ needs.changes.outputs.base }}
        run: npx vitest run --changed="$DIFF_BASE" --passWithNoTests
