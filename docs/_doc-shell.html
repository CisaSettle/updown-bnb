<!doctype html>
<html lang="zh-Hans" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_ZH}}</title>
<script>
  // Settle the language before the first paint, so a 中文 reader never sees a frame of English.
  (function () {
    try {
      var v = localStorage.getItem('updown-doc-lang');
      if (v === 'en' || v === 'zh') {
        document.documentElement.setAttribute('data-lang', v);
        document.documentElement.setAttribute('lang', v === 'en' ? 'en' : 'zh-Hans');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#fbfaf7; --panel:#ffffff; --ink:#16181d; --muted:#6b6a66;
    --rule:#e0dbd1; --rule-strong:#c9c3b6;
    --accent:#b8780c; --accent-soft:#fdf3e0;
    --code-bg:#f3f0e9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14151a; --panel:#1b1d23; --ink:#e9e7e1; --muted:#9b978e;
      --rule:#2c2f37; --rule-strong:#3d414b;
      --accent:#e0a63f; --accent-soft:#2a2114;
      --code-bg:#1f222a;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14151a; --panel:#1b1d23; --ink:#e9e7e1; --muted:#9b978e;
    --rule:#2c2f37; --rule-strong:#3d414b;
    --accent:#e0a63f; --accent-soft:#2a2114;
    --code-bg:#1f222a;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
    font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  [data-lang="zh"] .en{display:none}
  [data-lang="en"] .zh{display:none}

  header.top{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);
  }
  .bar{max-width:60rem; margin:0 auto; padding:.65rem 1.5rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
  .mark{
    font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif; font-weight:800; font-size:.95rem;
    margin-right:auto; min-width:0; letter-spacing:-.01em;
  }
  .mark a{color:inherit; text-decoration:none}
  .mark em{color:var(--accent); font-style:normal}
  .toggle{display:flex; border:1px solid var(--rule-strong); border-radius:999px; overflow:hidden; flex:none}
  .toggle button{
    font:inherit; font-size:.78rem; font-weight:600; padding:.28rem .8rem;
    background:transparent; color:var(--muted); border:0; cursor:pointer;
  }
  .toggle button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
  .toggle button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

  main{max-width:60rem; margin:0 auto; padding:2.5rem 1.5rem 6rem}
  .canonical{
    font-size:.78rem; color:var(--muted); border-left:3px solid var(--rule-strong);
    padding:.15rem 0 .15rem 1rem; margin:0 0 2.5rem;
  }

  h1,h2,h3,h4{font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif; letter-spacing:-.015em; text-wrap:balance}
  h1{font-weight:800; font-size:clamp(1.8rem,4vw,2.6rem); line-height:1.1; margin:0 0 1.5rem}
  h2{font-weight:800; font-size:1.5rem; margin:3.2rem 0 .9rem; padding-top:1.2rem; border-top:1px solid var(--rule)}
  h3{font-weight:600; font-size:1.15rem; margin:2.2rem 0 .7rem}
  h4{font-weight:600; font-size:1rem; margin:1.6rem 0 .5rem}
  p{margin:1rem 0; max-width:70ch}
  ul,ol{max-width:70ch; padding-left:1.35rem}
  li{margin:.4rem 0}
  hr{border:0; border-top:1px solid var(--rule); margin:2.5rem 0}
  a{color:var(--accent)}

  code{
    background:var(--code-bg); padding:.12rem .34rem; border-radius:4px;
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:.86em; word-break:break-word;
  }
  pre{
    background:var(--code-bg); border:1px solid var(--rule); border-radius:10px;
    padding:1rem 1.1rem; overflow-x:auto; margin:1.2rem 0; line-height:1.6;
  }
  pre code{background:none; padding:0; font-size:.82rem}

  blockquote{
    margin:1.5rem 0; padding:.1rem 1.2rem; border-left:4px solid var(--accent);
    background:var(--accent-soft); border-radius:0 8px 8px 0;
  }
  blockquote p{margin:.9rem 0}

  .scroll{overflow-x:auto; border:1px solid var(--rule); border-radius:10px; margin:1.3rem 0; background:var(--panel)}
  table{border-collapse:collapse; width:100%; font-size:.88rem}
  th,td{padding:.6rem .85rem; text-align:left; border-bottom:1px solid var(--rule); vertical-align:top}
  th{
    font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    font-weight:600; white-space:nowrap; background:color-mix(in srgb, var(--ink) 4%, var(--panel));
  }
  tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="mark"><a href="../README.md">UpDown <em>·</em> </a><span class="zh">{{TITLE_ZH}}</span><span class="en">{{TITLE_EN}}</span></div>
    <div class="toggle" role="group" aria-label="Language">
      <button type="button" data-set="zh" aria-pressed="true">中文</button>
      <button type="button" data-set="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main>
  <p class="canonical">
    <span class="zh">本页由 <code>{{SOURCE}}</code> 生成，那份 Markdown 才是权威版本。两种语言同时生成，任一方落后于另一方时构建会直接失败。</span>
    <span class="en">Generated from <code>{{SOURCE}}</code>, which is the canonical copy. Both languages are built together, and the build fails if one falls behind the other.</span>
  </p>
{{BODY}}
</main>
<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll('.toggle button');
    function apply(lang) {
      root.setAttribute('data-lang', lang);
      root.setAttribute('lang', lang === 'en' ? 'en' : 'zh-Hans');
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === lang)); });
      try { localStorage.setItem('updown-doc-lang', lang); } catch (e) {}
    }
    var saved = null;
    try { saved = localStorage.getItem('updown-doc-lang'); } catch (e) {}
    apply(saved === 'en' ? 'en' : 'zh');
    buttons.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.set); }); });
  })();
</script>
</body>
</html>
